name: focus_flow
description: Offline-first time planning, AI GitHub digest, and personal knowledge base.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_secure_storage: 9.2.2
  uuid: ^4.6.0
  huawei_push: ^6.15.0+300

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
